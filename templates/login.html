<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — VNTAX</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #1a7f37;
    --accent-dark: #146029;
    --err: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .logo-badge {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
  input[type=password] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .error {
    background: #fdecea;
    color: var(--err);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">MST</div>
    <h1>Tra cứu mã số thuế hàng loạt</h1>
    <p class="subtitle">VNTAX · Công cụ văn phòng — nhập mật khẩu để tiếp tục</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Mật khẩu" autofocus required>
      <button type="submit" class="btn">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
